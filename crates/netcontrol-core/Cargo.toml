[package]
name = "netcontrol-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core models, subnet math, device classification, and bandwidth statistics for NetControl (Rust rebuild, Phase 1). Network operations are intentionally not implemented."

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
